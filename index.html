<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Demir Demirdöğen, Software Engineering Student</title>
    <meta
      name="description"
      content="Software Engineering student at Yaşar University. Building YU-Sync, .NET microservices, and low-level graphics projects in Java and Vulkan."
    />
    <meta name="author" content="Demir Demirdöğen" />
    <link rel="canonical" href="https://demirdogen.dev/" />

    <!--
      Applies the theme before first paint. Without this, the page renders in
      the :root (light) palette until React mounts, so a dark-theme visit
      flashes white and routes outside Layout (the 404) never get a theme.
      Keep the default and storage key in sync with Layout.tsx.
    -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.classList.toggle('dark', theme === 'dark');
      })();
    </script>

    <!-- Matches --background in src/index.css for each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10141c" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Demir Demirdöğen" />

    <meta property="og:image:height" content="630" />
